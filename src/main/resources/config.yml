# HotbarPets configuration

# Producer pets (Chicken, Mooshroom, Fish and Golden Cow) keep the classic
# cadence by default. Raise this value to reduce passive processing frequency.
production-interval-ticks: 2000

# Additive modern pets. Existing/classic pets and their item IDs are unchanged.
modern-pets:
  breeze:
    enabled: true
  copper-golem:
    enabled: true
  nautilus:
    enabled: true

# Optional per-HotbarPet ability entitlement. DISABLED by default, preserving
# existing servers, crafting, research, trades and pet possession.
# Default permission node example: HOTBAR_PET_PIG -> slimefun.hotbarpet.pig
#                               HOTBAR_PET_ENDER_MAN -> slimefun.hotbarpet.ender_man
# The prefix remains configurable. Older Albion NPCs may continue to grant
# albion.hotbarpet.* if this setting is explicitly set to 'albion.hotbarpet.'.
# Existing plugins/HotbarPets/config.yml files are not overwritten on upgrade.
permission-gating:
  enabled: false
  prefix: 'slimefun.hotbarpet.'
