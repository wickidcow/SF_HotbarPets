# HotbarPets configuration

# Producer pets (Chicken, Mooshroom, Fish and Golden Cow) keep the classic
# cadence by default. Raise this value to reduce passive processing frequency.
production-interval-ticks: 2000

# Additive modern pets. Existing/classic pets and their item IDs are unchanged.
modern-pets:
  breeze:
    enabled: true
  copper-golem:
    enabled: true
  nautilus:
    enabled: true

# Optional per-HotbarPet ability entitlement. DISABLED by default so existing
# servers, recipes, pet ownership and trades keep working unchanged.
# Albion's BetonQuest NPC 132 awards this node when a player buys a Hotbar Pet:
#   albion.hotbarpet.<lowercase Slimefun item ID without HOTBAR_PET_>
# Example: HOTBAR_PET_ENDER_MAN -> albion.hotbarpet.ender_man
# This checks ability use; it does not prevent crafting or trading pet items.
permission-gating:
  enabled: false
  prefix: 'albion.hotbarpet.'
