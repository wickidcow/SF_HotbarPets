name: Build SF_HotbarPets
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this validated versioned release'
        required: true
        type: boolean
        default: false
      confirm_version:
        description: 'Type the exact ARTIFACT_VERSION when publish=true'
        required: false
        type: string
        default: ''
permissions:
  contents: read
env:
  ARTIFACT_VERSION: '1.0.5'
  OUTPUT_NAME: SF_HotbarPets1.0.5.jar
  SLIMEFUN_LEGACY_VERSION: '4.1.75'
concurrency:
  group: sf-hotbarpets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install checksum-verified stable core API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .deps
          gh release download "v${SLIMEFUN_LEGACY_VERSION}" --repo wickidcow/Slimefun-Legacy --pattern "Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" --dir .deps
          printf '%s  %s\n' 206cd1e54e81bf7d3968b2b2a4bd698f1271dca9dd474f2aebf4a7a195c1b060 ".deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" | sha256sum --check
          mvn -B -ntp install:install-file -Dfile=".deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" -DgroupId=com.github.slimefun -DartifactId=Slimefun -Dversion="${SLIMEFUN_LEGACY_VERSION}" -Dpackaging=jar -DgeneratePom=true
      - name: Compile supported Paper API lines
        run: |
          set -euo pipefail
          for API in 1.21.11-R0.1-SNAPSHOT 26.2.build.112-stable 26.3.build.205-stable; do
            mvn -B -ntp -DskipTests "-Dpaper.version=$API" clean package
          done
      - name: Full baseline tests and independent reproducible build
        run: |
          set -euo pipefail
          mvn -B -ntp -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean verify
          mkdir -p dist test-evidence
          cp target/surefire-reports/TEST-*.xml test-evidence/
          cp "target/$OUTPUT_NAME" "dist/$OUTPUT_NAME"
          mvn -B -ntp -DskipTests -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean package
          cmp "target/$OUTPUT_NAME" "dist/$OUTPUT_NAME"
      - name: Validate exact reports and installable archive
        run: |
          python3 - <<'PY'
          import os,re,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          reports=[ET.parse(p).getroot() for p in Path('test-evidence').glob('TEST-*.xml')]
          assert sum(int(r.attrib['tests']) for r in reports)==49
          assert all(int(r.attrib[k])==0 for r in reports for k in ('failures','errors','skipped'))
          with zipfile.ZipFile('dist/'+os.environ['OUTPUT_NAME']) as jar:
              assert jar.testzip() is None
              descriptor=jar.read('plugin.yml').decode()
              assert re.search(r'(?m)^version:\s*[\'\"]?'+re.escape(os.environ['ARTIFACT_VERSION'])+r'[\'\"]?\s*$',descriptor)
              assert "api-version: '1.21.11'" in descriptor or 'api-version: 1.21.11' in descriptor
              for name in jar.namelist():
                  assert not name.startswith(('org/junit/','org/mockito/','org/mockbukkit/','net/bytebuddy/','io/github/thebusybiscuit/slimefun4/','net/guizhanss/guizhanlib/')),name
                  if name.endswith('.class') and not name.startswith('META-INF/versions/'):
                      data=jar.read(name);assert data[:4]==b'\xca\xfe\xba\xbe'
                      assert int.from_bytes(data[6:8],'big')<=65 and int.from_bytes(data[4:6],'big')!=65535,name
          PY
          sha256sum "dist/$OUTPUT_NAME"
      - name: Retain actual regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: addon-regression-reports
          path: |
            test-evidence/TEST-*.xml
            target/surefire-reports/TEST-*.xml
          retention-days: 14
          if-no-files-found: warn
      - name: Upload raw JAR
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

  publish:
    name: Publish validated immutable HotbarPets release
    needs: [build, native-paper-addon-smoke]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download validated raw JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist
          skip-decompress: true

      - name: Validate explicit release publication request
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          # A dispatch from a PR/test branch or stale master must not publish.
          test "$GITHUB_REF" = 'refs/heads/master'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          CURRENT_MASTER="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
          test "$CURRENT_MASTER" = "$GITHUB_SHA" || {
            echo 'Refusing publication: master advanced after workflow dispatch.' >&2
            exit 1
          }
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          ns = '{http://maven.apache.org/POM/4.0.0}'
          version = ET.parse('pom.xml').getroot().findtext(ns + 'version')
          assert version == os.environ['ARTIFACT_VERSION'], (version, os.environ['ARTIFACT_VERSION'])
          PY
          test "$CONFIRM_VERSION" = "$ARTIFACT_VERSION" || {
            echo "Refusing publication: confirm_version must exactly match ARTIFACT_VERSION ($ARTIFACT_VERSION)." >&2
            exit 1
          }
          JAR="dist/$OUTPUT_NAME"
          test -s "$JAR"
          TAG="v${ARTIFACT_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing publication: release $TAG already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Refusing publication: tag $TAG already exists." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish canonical raw JAR release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release_state.outputs.tag }}"
          test -n "$TAG"
          JAR="dist/$OUTPUT_NAME"
          test -s "$JAR"
          gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "HotbarPets $ARTIFACT_VERSION" --notes 'Publishes the reviewed Folia/Paper compatibility release. Player food effects use the owning entity scheduler, existing pet IDs/recipes/food requirements are unchanged, and the 1.21.11/Java 21 floor is retained.'

  # PR-only integration: use the already-published core and upstream's
  # fixed-source native addon harness. Never rebuild the full core here.
  native-paper-addon-smoke:
    name: Two-boot Paper 26.2 / Slimefun 4.1.78 addon startup
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish == true)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Check out pinned published core's native addon harness
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: b14a3bcc5ef221c013f93d49b6b3a1bbdb3101e9
          path: native/slimefun-core
          persist-credentials: false
      - name: Download exact validated candidate JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: native/addon
          skip-decompress: true
      - name: Verify official core bytes and candidate attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p native/release
          gh release download v4.1.78 --repo wickidcow/Slimefun-Legacy \
            --pattern Slimefun-Legacy4.1.78.jar --dir native/release
          printf '%s  %s\n' \
            39ca485409b27d1705a28a24e3d6e681e731709d4163bcd500d347b090ea97ba \
            native/release/Slimefun-Legacy4.1.78.jar | sha256sum --check --strict
          test -s "native/addon/$OUTPUT_NAME"
          sha256sum "native/addon/$OUTPUT_NAME" | tee native/addon-sha256.txt
      - name: Boot candidate twice on official stable Paper with real Slimefun
        env:
          PAPER_MINECRAFT_VERSION: '26.2'
          SLIMEFUN_SMOKE_VERSION: '4.1.78'
          PAPER_DOWNLOAD_USER_AGENT: 'Slimefun-Legacy-HotbarPets-PR-Smoke/1.0 (https://github.com/wickidcow/SF_HotbarPets)'
        run: |
          set -euo pipefail
          bash native/slimefun-core/scripts/addon_runtime_smoke.sh \
            native/release/Slimefun-Legacy4.1.78.jar \
            "native/addon/$OUTPUT_NAME" \
            HotbarPets native/hotbarpets-runtime
          test -s native/hotbarpets-runtime/smoke-result.txt
      - name: Retain native startup and restart receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hotbarpets-4.1.78-paper-26.2-native-smoke
          path: |
            native/addon-sha256.txt
            native/hotbarpets-runtime/*.console.log
            native/hotbarpets-runtime/*.normalized.log
            native/hotbarpets-runtime/paper-build.txt
            native/hotbarpets-runtime/smoke-result.txt
          retention-days: 14
          if-no-files-found: warn
